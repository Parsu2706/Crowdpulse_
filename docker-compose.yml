services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped

  api:
    build: { context: ., dockerfile: api/Dockerfile }
    env_file:
      - path: .env
        required: false                        # don't fail if .env is missing
    environment:
      REDIS_URL: redis://redis:6379/0
      DATA_DIR: /app/data
    volumes:
      - ./data:/app/data                       # scraped data + analysis survive restarts
      - hf_cache:/root/.cache/huggingface      # models download once
    ports: ["8000:8000"]
    depends_on: [redis]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  dashboard:
    build: { context: ., dockerfile: dashboard/Dockerfile }
    environment:
      API_URL: http://api:8000
    ports: ["8501:8501"]
    depends_on:
      api:
        condition: service_healthy

volumes:
  hf_cache: